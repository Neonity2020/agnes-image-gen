<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agnes API 适配层速查表</title><style>body{max-width:820px;margin:48px auto;padding:0 24px;font:16px/1.7 system-ui,sans-serif;color:#24221f}dt{font-weight:700;margin-top:16px}dd{margin:3px 0}code{background:#f2f0eb;padding:2px 5px;border-radius:4px}</style><h1>Agnes API 适配层速查表</h1><dl><dt><code>request</code></dt><dd>统一 URL、Authorization、AbortController 超时、JSON 解码与非 2xx 错误。</dd><dt><code>generateText</code></dt><dd>构造 chat messages：system、历史、当前 user prompt。</dd><dt><code>generateImage</code></dt><dd>发送尺寸与可选 Data URL 参考图，解析图片 URL/base64。</dd><dt><code>generateVideo</code></dt><dd>创建任务；若没有即时 URL，则轮询状态直到完成、失败或超时。</dd><dt><code>normalizeGenerationError</code></dt><dd>将网络和超时异常转为 UI 可显示的中文文本。</dd></dl></html>
