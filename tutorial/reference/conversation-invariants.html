<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会话线程不变量</title><style>body{max-width:820px;margin:48px auto;padding:0 24px;font:16px/1.7 system-ui,sans-serif;color:#24221f}li{margin:10px 0}code{background:#f2f0eb;padding:2px 5px;border-radius:4px}</style><h1>会话线程不变量</h1><ol><li>界面只渲染 <code>activeConversationId</code> 指向的条目。</li><li>模型历史只来自当前线程中成功的文本问答。</li><li>每个请求在开始时固定 <code>conversationId</code> 和 <code>entry.id</code>。</li><li>成功与失败都按这两个 ID 回写，绝不按“当前线程”回写。</li><li><code>updated</code> 随任务创建和完成更新；侧栏按它倒序。</li><li>媒体可显示在会话中，但不进入文本 history。</li></ol></html>
