<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发布检查清单</title><style>body{max-width:820px;margin:48px auto;padding:0 24px;font:16px/1.7 system-ui,sans-serif;color:#24221f}li{margin:10px 0}code{background:#f2f0eb;padding:2px 5px;border-radius:4px}</style><h1>发布检查清单</h1><ol><li><code>pnpm typecheck</code> 通过。</li><li><code>pnpm build</code> 通过；检查 Vite 的包体积警告。</li><li><code>pnpm preview</code> 中手动验证文本、图片、视频、错误与多轮会话。</li><li>确认 VITE 变量没有承载私密服务端密钥。</li><li>确认 Netlify Build command 为 <code>npm run build</code>，Publish directory 为 <code>dist</code>。</li><li>检查响应头和 assets 缓存策略。</li><li>在真实部署域名验证 Agnes API 的 CORS 与浏览器网络请求。</li></ol></html>
