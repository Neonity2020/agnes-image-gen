<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地存储契约</title><style>body{max-width:820px;margin:48px auto;padding:0 24px;font:16px/1.7 system-ui,sans-serif;color:#24221f}dt{font-weight:700;margin-top:16px}dd{margin:4px 0}code{background:#f2f0eb;padding:2px 5px;border-radius:4px}</style><h1>本地存储契约</h1><dl><dt><code>haze_agnes_api_key</code></dt><dd>当前浏览器 API Key；只供本机使用。</dd><dt><code>haze_conversations</code></dt><dd>新版会话数组；最多 30 条线程、每条最多 50 个条目。</dd><dt>读取策略</dt><dd>JSON 解析失败、顶层不是数组、会话字段无效时安全忽略，不使应用崩溃。</dd><dt>迁移策略</dt><dd>新版键不存在时读取旧活动对话与旧生成历史，并转换为线程。</dd></dl></html>
