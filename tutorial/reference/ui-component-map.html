<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UI 组件职责速查表</title><style>body{max-width:820px;margin:48px auto;padding:0 24px;font:16px/1.7 system-ui,sans-serif;color:#24221f}code{background:#f2f0eb;padding:2px 5px;border-radius:4px}dt{font-weight:700;margin-top:18px}dd{margin:4px 0}</style><h1>UI 组件职责速查表</h1><dl><dt><code>App</code></dt><dd>布局、状态与回调的协调者；不应承担视觉细节。</dd><dt><code>AppSidebar</code></dt><dd>显示对话列表、发出“新建 / 选择 / 删除”意图。</dd><dt><code>WelcomePanel</code></dt><dd>空会话的引导与提示词建议。</dd><dt><code>Conversation</code></dt><dd>根据条目状态渲染文本、图片、视频、加载与错误结果。</dd><dt><code>PromptComposer</code></dt><dd>输入、模式切换、尺寸、参考图与提交交互。</dd><dt><code>SettingsDialog</code></dt><dd>编辑 API Key；通过回调把保存意图交还给 App。</dd><dt><code>components/ui</code></dt><dd>shadcn/ui 原语封装；优先复用，避免每个业务组件重新实现焦点和无障碍行为。</dd></dl></html>
